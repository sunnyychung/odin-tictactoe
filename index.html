<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
</head>
<body>
    <dialog id="dialog">
        <form>
            <legend>User Settings</legend>
            <fieldset>
                <div class="player">
                    <label for="username">Player 1 Username</label>
                    <input type="text" name="username1" id="username1" required>

                    <div>
                        <label for="symbol1">X</label>
                        <input type="radio" id="symbol1x" name="symbol1" value="x" checked>
                    </div>

                    <div>
                        <label for="symbol1">O</label>
                        <input type="radio" id="symbol1y" name="symbol1" value="o">
                    </div>
                </div> 

                <div class="player">
                    <label for="username">Player 2 Username</label>
                    <input type="text" name="username2" id="username2" required>

                    <div>
                        <label for="symbol2">X</label>
                        <input type="radio" id="symbol2x" name="symbol2" value="x">
                    </div>

                    <div>
                        <label for="symbol2">O</label>
                        <input type="radio" id="symbol2y" name="symbol2" value="o" checked>
                    </div>
                </div> 
            </fieldset>
            <button id="saveBtn">Save</button>
        </form>
    </dialog>

    <div class="header"><h1>Tic-Tac-Toe</h1></div>

    <main>
        <div class="players">
            <h2 id="player1">Player1</h2>
            <h2 id="player2">Player2</h2>
        </div>
        <h2>Turn: <span class="turn"></span></h2>
        <div class="game">
            <div class="cell" id="cell-0-0"></div>
            <div class="cell" id="cell-0-1"></div>
            <div class="cell" id="cell-0-2"></div>

            <div class="cell" id="cell-1-0"></div>
            <div class="cell" id="cell-1-1"></div>
            <div class="cell" id="cell-1-2"></div>

            <div class="cell" id="cell-2-0"></div>
            <div class="cell" id="cell-2-1"></div>
            <div class="cell" id="cell-2-2"></div>
        </div>
    </main>


    <script src="script.js"></script>
</body>
</html>
